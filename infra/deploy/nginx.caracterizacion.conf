# ============================================================
# Nginx del stack de caracterización (contenedor cz_nginx)
# Sirve el panel web (SPA React) y el API Django en el MISMO origen
# para evitar CORS. Publicado por el host en http://<IP>:8090
# ============================================================
server {
    listen 80;
    server_name _;

    client_max_body_size 5M;

    root /usr/share/nginx/html;
    index index.html;

    # --- API REST (Django / DRF) ---
    location /api/ {
        proxy_pass http://cz_backend:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Admin de Django ---
    location /admin/ {
        proxy_pass http://cz_backend:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Autorización de excepciones de vigencia (pantalla de coordinación) ---
    #
    # Sin esta location la URL cae en `location /` y la sirve la SPA de React,
    # que no conoce la ruta y muestra su pantalla de error. Se agrega ANTES del
    # catch-all a propósito; el orden de `location` con prefijo lo resuelve
    # nginx por especificidad, pero dejarla acá arriba la hace visible.
    #
    # La página también responde en `/api/autorizaciones/`, que ya llegaba al
    # backend por la primera location. Esa fue la vía mientras este nginx no
    # estaba desplegado.
    location /autorizaciones/ {
        proxy_pass http://cz_backend:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Estáticos de Django (admin, DRF browsable API) ---
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- Descarga de la APK móvil ---
    location /movil/ {
        alias /app/movil/;
        autoindex on;
        # Forzar descarga del .apk con el tipo correcto
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
    }

    # --- Página pública de descarga con QR ---
    location /descargar {
        alias /app/descargar/;
        index index.html;
        try_files $uri $uri/ /descargar/index.html;
    }

    # --- Panel web SPA: cualquier ruta cae en index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
