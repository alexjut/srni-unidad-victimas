# ============================================================
# SRNI Caracterización — Stack de despliegue (servidor UARIV)
# ------------------------------------------------------------
# Aislado en su propia red `caracterizacion_net`. NO toca los
# servicios existentes (nginx-proxy-manager, uariv-auth-service).
# Publica el panel web + API por IP en el puerto 8090 (HTTP).
#
# Uso (desde la raíz del proyecto en el servidor):
#   docker compose -f infra/deploy/docker-compose.caracterizacion.yml up -d --build
# ============================================================
name: caracterizacion

# Bloque de entorno común para backend y celery (evita repetir)
x-backend-env: &backend_env
  DJANGO_SETTINGS_MODULE: srni.settings.servidor
  SECRET_KEY: ${SECRET_KEY}
  DEBUG: "False"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_HOST: cz_postgres
  DB_PORT: "5432"
  DB_SSL_MODE: disable
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
  REDIS_URL: redis://:${REDIS_PASSWORD}@cz_redis:6379/0
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  # De dónde salen las personas al buscar por documento:
  #   DJANGO → el padrón cargado en nuestra base (lo real)
  #   MOCK   → datos de prueba (ENC001, documentos 999…)
  # Sin declararlo, Django cae a MOCK y la APK muestra gente inventada aunque el
  # padrón esté cargado. Pasó: el 31-jul producción llevaba semanas en MOCK.
  # El default de acá es DJANGO justamente para que no vuelva a pasar en silencio.
  VICTIMA_REPOSITORY: ${VICTIMA_REPOSITORY:-DJANGO}
  # Oracle legacy de la UARIV (30.0.1.9/ENTREVISTARN). Lo necesitan dos cosas:
  # la carga del padrón (`cargar_padron_oracle`) y el disparador automático que
  # sincroniza cada hogar caracterizado hacia los procedures GIC_*.
  # Los valores viven solo en el `.env` del servidor (chmod 600); aquí van los
  # nombres. Sin esta declaración, ponerlos en el `.env` no sirve de nada: el
  # contenedor no los ve — pasó el 31-jul y costó una vuelta entera.
  ORACLE_PROD_HOST: ${ORACLE_PROD_HOST:-}
  ORACLE_PROD_PORT: ${ORACLE_PROD_PORT:-1521}
  ORACLE_PROD_SERVICE: ${ORACLE_PROD_SERVICE:-}
  ORACLE_PROD_USER: ${ORACLE_PROD_USER:-}
  ORACLE_PROD_PASSWORD: ${ORACLE_PROD_PASSWORD:-}
  # ── Tareas programadas (celery beat) ────────────────────────────────────────
  # Las dos APAGADAS por defecto: encenderlas lee/escribe bases de producción, así
  # que es una decisión operativa explícita y no un efecto de desplegar. Los
  # horarios se leen de aquí —no del código— para poder moverlos editando el `.env`
  # y recreando cz_beat, sin reconstruir la imagen ni hacer un release.
  #
  # Recarga del padrón: cadena completa (padrón + fechas + SQLite), primer sábado
  # del mes 20:00 hora Colombia. Dura del orden de un día, por eso el fin de semana.
  PADRON_RECARGA_HABILITADA: ${PADRON_RECARGA_HABILITADA:-False}
  PADRON_RECARGA_HORA: ${PADRON_RECARGA_HORA:-20}
  PADRON_RECARGA_DIA_SEMANA: ${PADRON_RECARGA_DIA_SEMANA:-saturday}
  PADRON_RECARGA_DIAS_MES: ${PADRON_RECARGA_DIAS_MES:-1-7}
  # Refresco diario (solo fechas + SQLite, ~15 min): mantiene viva la regla de
  # recaracterización a 2 años frente a lo que la app legacy caracteriza cada día.
  PADRON_REFRESCO_HORA: ${PADRON_REFRESCO_HORA:-3}
  # Barrida que reencola los hogares que quedaron sin escribirse en Oracle.
  SYNC_REINTENTO_HABILITADO: ${SYNC_REINTENTO_HABILITADO:-False}
  SYNC_REINTENTO_CADA_MINUTOS: ${SYNC_REINTENTO_CADA_MINUTOS:-15}
  SYNC_REINTENTO_LIMITE: ${SYNC_REINTENTO_LIMITE:-50}
  SYNC_REINTENTO_ENFRIAMIENTO: ${SYNC_REINTENTO_ENFRIAMIENTO:-30}
  SYNC_REINTENTO_MAX_INTENTOS: ${SYNC_REINTENTO_MAX_INTENTOS:-5}
  # Interruptor de la escritura automática a Oracle. La barrida NO encola nada si
  # está apagado: sería llenar la cola de no-ops cada cuarto de hora.
  ORACLE_SYNC_AUTOMATICA: ${ORACLE_SYNC_AUTOMATICA:-False}
  ORACLE_SYNC_DESTINO: ${ORACLE_SYNC_DESTINO:-}
  # Dónde aterriza el padrón SQLite descargable. Va sobre el volumen cz_media, que
  # comparten el generador (cz_celery_padron) y el que lo sirve (cz_backend).
  MEDIA_ROOT: /app/media

services:
  cz_postgres:
    image: postgres:16-alpine
    container_name: cz_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - cz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cz_net]
    restart: unless-stopped

  cz_redis:
    image: redis:7-alpine
    container_name: cz_redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - cz_redisdata:/data
    networks: [cz_net]
    restart: unless-stopped

  cz_backend:
    build:
      context: ../../srni-backend
      dockerfile: Dockerfile
    image: srni-caracterizacion-backend:latest
    container_name: cz_backend
    command: gunicorn srni.wsgi:application --bind 0.0.0.0:8001 --workers 4 --timeout 120
    environment: *backend_env
    volumes:
      - cz_static:/app/staticfiles
      # El padrón SQLite lo GENERA cz_celery_padron y lo SIRVE este contenedor por
      # /api/victimas/padron/download/. Sin el volumen compartido cada uno vería su
      # propio directorio: la tarea reportaría OK y la APK seguiría bajando el
      # padrón viejo, o un 404.
      - cz_media:/app/media
    depends_on:
      cz_postgres:
        condition: service_healthy
      cz_redis:
        condition: service_started
    networks: [cz_net]
    restart: unless-stopped
    # Sin exposición de puerto al host — solo accesible vía cz_nginx

  cz_celery:
    image: srni-caracterizacion-backend:latest
    container_name: cz_celery
    command: celery -A srni worker -Q sync,reports -l INFO --concurrency 2
    environment: *backend_env
    volumes:
      - cz_media:/app/media
    depends_on:
      cz_postgres:
        condition: service_healthy
      cz_redis:
        condition: service_started
    networks: [cz_net]
    restart: unless-stopped

  # ── Worker DEDICADO a la cola del padrón ──────────────────────────────────
  # Separado de cz_celery a propósito. La recarga del padrón ocupa un slot durante
  # HORAS; en un worker con `--concurrency 2` eso significa quedarse con la mitad de
  # la capacidad de escritura a Oracle mientras dure, y con la re-entrega de tareas
  # (`acks_late`) el reparto empeora. Con cola propia, la sincronización de hogares
  # sigue fluyendo aunque el padrón lleve dos días cargando.
  #
  # `--concurrency 1`: las tareas del padrón se excluyen entre sí de todos modos
  # (bloqueo en Redis), así que un segundo proceso solo gastaría memoria — y esta
  # tarea llega a mantener lotes de miles de filas en el buffer.
  cz_celery_padron:
    image: srni-caracterizacion-backend:latest
    container_name: cz_celery_padron
    command: celery -A srni worker -Q padron -l INFO --concurrency 1
    environment: *backend_env
    volumes:
      # Aquí se ESCRIBE el padrón SQLite (generar_padron → MEDIA_ROOT/padron/).
      - cz_media:/app/media
    depends_on:
      cz_postgres:
        condition: service_healthy
      cz_redis:
        condition: service_started
    networks: [cz_net]
    restart: unless-stopped

  # ── Reloj de las tareas programadas ───────────────────────────────────────
  # Servicio APARTE, no `celery worker -B`.
  #
  # `-B` mete el scheduler dentro del worker, y ahí hay dos problemas. El grave: el
  # reloj se multiplica con el worker. Hoy hay una sola instancia, pero basta con
  # `docker compose up --scale cz_celery=2` —o un segundo worker para desahogar la
  # cola— para que cada réplica dispare su propia copia de cada tarea: dos recargas
  # del padrón contra el Oracle de producción, disparadas por diseño. El menor: no
  # se puede reiniciar el worker sin reiniciar el reloj.
  #
  # Con un servicio dedicado hay exactamente UN reloj, se lo puede apagar sin tocar
  # las colas, y sus logs no se mezclan con los de las tareas.
  #
  # `--schedule` sobre un volumen: beat guarda ahí cuándo disparó cada entrada por
  # última vez. En el filesystem del contenedor se perdería en cada recreación y el
  # calendario mensual arrancaría de cero cada despliegue.
  #
  # `--pidfile=` vacío: por defecto beat escribe `celerybeat.pid` en el directorio de
  # trabajo y se NIEGA a arrancar si ya existe. Un contenedor que muere sin limpiarlo
  # (OOM, `docker kill`) no vuelve a levantar nunca — y como el reloj no da errores
  # visibles, se descubre cuando alguien nota que hace semanas no corre nada.
  cz_beat:
    image: srni-caracterizacion-backend:latest
    container_name: cz_beat
    command: >
      celery -A srni beat -l INFO
      --schedule /var/lib/celery/celerybeat-schedule
      --pidfile=
    environment: *backend_env
    volumes:
      - cz_beatdata:/var/lib/celery
    depends_on:
      # Solo Redis: con el schedule estático en settings, beat no consulta la base
      # de datos para nada — se limita a poner mensajes en el broker. (Con
      # django-celery-beat sí dependería de PostgreSQL, y una BD lenta o caída se
      # convertiría en un reloj que no dispara.)
      cz_redis:
        condition: service_started
    networks: [cz_net]
    restart: unless-stopped

  cz_nginx:
    image: nginx:1.25-alpine
    container_name: cz_nginx
    ports:
      - "8090:80"
    volumes:
      - ./nginx.caracterizacion.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../srni-frontend/dist:/usr/share/nginx/html:ro
      - ./descargar:/app/descargar:ro
      - cz_static:/app/staticfiles:ro
      - ./movil:/app/movil:ro
    depends_on:
      - cz_backend
    networks: [cz_net, uariv_ext]
    restart: unless-stopped

volumes:
  cz_pgdata:
  cz_redisdata:
  cz_static:
  # Padrón SQLite descargable: lo escribe cz_celery_padron, lo sirve cz_backend.
  cz_media:
  # Última ejecución de cada entrada del schedule (shelve de celery beat).
  cz_beatdata:

networks:
  cz_net:
    name: caracterizacion_net
  # Red del reverse-proxy compartido (nginx-proxy-manager). Necesaria para que el
  # dominio institucional vía WAF (FortiWeb 443 → 30.0.1.109:80 → NPM → cz_nginx:80)
  # alcance el backend. Ver memoria: WAF dominio / project_ngrok_web_filter.
  uariv_ext:
    name: uariv-network
    external: true
