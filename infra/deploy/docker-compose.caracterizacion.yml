# ============================================================
# SRNI Caracterización — Stack de despliegue (servidor UARIV)
# ------------------------------------------------------------
# Aislado en su propia red `caracterizacion_net`. NO toca los
# servicios existentes (nginx-proxy-manager, uariv-auth-service).
# Publica el panel web + API por IP en el puerto 8090 (HTTP).
#
# Uso (desde la raíz del proyecto en el servidor):
#   docker compose -f infra/deploy/docker-compose.caracterizacion.yml up -d --build
# ============================================================
name: caracterizacion

# Bloque de entorno común para backend y celery (evita repetir)
x-backend-env: &backend_env
  DJANGO_SETTINGS_MODULE: srni.settings.servidor
  SECRET_KEY: ${SECRET_KEY}
  DEBUG: "False"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_HOST: cz_postgres
  DB_PORT: "5432"
  DB_SSL_MODE: disable
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
  REDIS_URL: redis://:${REDIS_PASSWORD}@cz_redis:6379/0
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  GEMINI_API_KEY: ${GEMINI_API_KEY}

services:
  cz_postgres:
    image: postgres:16-alpine
    container_name: cz_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - cz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cz_net]
    restart: unless-stopped

  cz_redis:
    image: redis:7-alpine
    container_name: cz_redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - cz_redisdata:/data
    networks: [cz_net]
    restart: unless-stopped

  cz_backend:
    build:
      context: ../../srni-backend
      dockerfile: Dockerfile
    image: srni-caracterizacion-backend:latest
    container_name: cz_backend
    command: gunicorn srni.wsgi:application --bind 0.0.0.0:8001 --workers 4 --timeout 120
    environment: *backend_env
    volumes:
      - cz_static:/app/staticfiles
    depends_on:
      cz_postgres:
        condition: service_healthy
      cz_redis:
        condition: service_started
    networks: [cz_net]
    restart: unless-stopped
    # Sin exposición de puerto al host — solo accesible vía cz_nginx

  cz_celery:
    image: srni-caracterizacion-backend:latest
    container_name: cz_celery
    command: celery -A srni worker -Q sync,reports -l INFO --concurrency 2
    environment: *backend_env
    depends_on:
      cz_postgres:
        condition: service_healthy
      cz_redis:
        condition: service_started
    networks: [cz_net]
    restart: unless-stopped

  cz_nginx:
    image: nginx:1.25-alpine
    container_name: cz_nginx
    ports:
      - "8090:80"
    volumes:
      - ./nginx.caracterizacion.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../srni-frontend/dist:/usr/share/nginx/html:ro
      - ./descargar:/app/descargar:ro
      - cz_static:/app/staticfiles:ro
      - ./movil:/app/movil:ro
    depends_on:
      - cz_backend
    networks: [cz_net, uariv_ext]
    restart: unless-stopped

volumes:
  cz_pgdata:
  cz_redisdata:
  cz_static:

networks:
  cz_net:
    name: caracterizacion_net
  # Red del reverse-proxy compartido (nginx-proxy-manager). Necesaria para que el
  # dominio institucional vía WAF (FortiWeb 443 → 30.0.1.109:80 → NPM → cz_nginx:80)
  # alcance el backend. Ver memoria: WAF dominio / project_ngrok_web_filter.
  uariv_ext:
    name: uariv-network
    external: true
