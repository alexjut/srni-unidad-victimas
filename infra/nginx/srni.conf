# Nginx — reverse proxy SRNI (producción)
# Coloca este archivo en /etc/nginx/sites-available/srni y haz symlink a sites-enabled/

upstream django_backend {
    server 127.0.0.1:8001;
    keepalive 16;
}

# Redirigir HTTP → HTTPS
server {
    listen 80;
    server_name srni.unidadvictimas.gov.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name srni.unidadvictimas.gov.co;

    # TLS
    ssl_certificate     /etc/letsencrypt/live/srni.unidadvictimas.gov.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srni.unidadvictimas.gov.co/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://www.unidadvictimas.gov.co; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'" always;

    # Rate limiting: 10 req/s general, 3 req/s en login
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_login:10m  rate=3r/m;

    # Tamaño máximo de body (respuestas bulk)
    client_max_body_size 2M;

    location /api/auth/login/ {
        limit_req zone=api_login burst=5 nodelay;
        proxy_pass http://django_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://django_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /var/www/srni/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        return 404;
    }
}
