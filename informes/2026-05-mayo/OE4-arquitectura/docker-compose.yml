version: '3.9'

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - static_files:/app/static:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./srni-backend
      dockerfile: Dockerfile
    command: gunicorn srni.wsgi:application --bind 0.0.0.0:8001 --workers 4 --timeout 120
    volumes:
      - static_files:/app/static
    env_file:
      - ./srni-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # Sin exposición de puerto al host — solo accesible via nginx

  celery:
    build:
      context: ./srni-backend
      dockerfile: Dockerfile
    command: celery -A srni worker -Q sync,reports -l INFO --concurrency 2
    env_file:
      - ./srni-backend/.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB_FILE: /run/secrets/pg_db
      POSTGRES_USER_FILE: /run/secrets/pg_user
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_db
      - pg_user
      - pg_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/pg_user)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  static_files:

secrets:
  pg_db:
    file: ./infra/secrets/pg_db.txt
  pg_user:
    file: ./infra/secrets/pg_user.txt
  pg_password:
    file: ./infra/secrets/pg_password.txt
